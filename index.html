<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creatsale - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
      --error: #ef4444;
      --success: #22c55e;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(37, 99, 235, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.1) 0%, transparent 40%);
    }
    .box {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
    }
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #60a5fa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 6px;
    }
    .tabs {
      display: flex;
      gap: 4px;
      background: #0f172a;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 24px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-weight: 500;
      font-size: 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab.active {
      background: var(--primary);
      color: #fff;
    }
    .form { display: none; }
    .form.active { display: block; }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0f172a;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus {
      border-color: var(--primary);
    }
    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 8px;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
    }
    .msg.error { display: block; background: rgba(239,68,68,0.15); color: #fca5a5; }
    .msg.success { display: block; background: rgba(34,197,94,0.15); color: #86efac; }
    .hint {
      margin-top: 20px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .hint code {
      background: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.78rem;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">
      <h1>Creatsale</h1>
      <p>Sales Dashboard</p>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="login">Login</button>
      <button class="tab" data-tab="register">Daftar</button>
    </div>

    <!-- Login Form -->
    <form class="form active" id="loginForm">
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" placeholder="Masukkan username" required autocomplete="username" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="Masukkan password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn" id="loginBtn">Masuk</button>
      <div class="msg" id="loginMsg"></div>
    </form>

    <!-- Register Form -->
    <form class="form" id="registerForm">
      <div class="field">
        <label>Nama Lengkap</label>
        <input type="text" name="name" placeholder="Nama kamu" required />
      </div>
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" placeholder="Pilih username" required autocomplete="username" />
      </div>
      <div class="field">
        <label>Email (opsional)</label>
        <input type="email" name="email" placeholder="email@contoh.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="Minimal 6 karakter" required minlength="6" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn" id="regBtn">Daftar</button>
      <div class="msg" id="regMsg"></div>
    </form>

    <p class="hint">
      Akun demo:<br>
      username: <code>admin</code> &nbsp; password: <code>admin123</code>
    </p>
  </div>

  <script>
    // Tabs
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab === 'login' ? 'loginForm' : 'registerForm').classList.add('active');
      });
    });

    // Check if already logged in
    fetch('/api/me').then(r => r.json()).then(d => {
      if (d.ok) window.location.href = '/dashboard';
    }).catch(() => {});

    function showMsg(el, text, type) {
      el.textContent = text;
      el.className = 'msg ' + type;
    }

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const msg = document.getElementById('loginMsg');
      btn.disabled = true;
      btn.textContent = 'Memproses...';

      const fd = new FormData(e.target);
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: fd.get('username'),
            password: fd.get('password')
          })
        });
        const data = await res.json();
        if (data.ok) {
          showMsg(msg, 'Login berhasil! Mengalihkan...', 'success');
          setTimeout(() => window.location.href = '/dashboard', 600);
        } else {
          showMsg(msg, data.message || 'Gagal login', 'error');
          btn.disabled = false;
          btn.textContent = 'Masuk';
        }
      } catch (err) {
        showMsg(msg, 'Server tidak merespons. Jalankan server dulu.', 'error');
        btn.disabled = false;
        btn.textContent = 'Masuk';
      }
    });

    // Register
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('regBtn');
      const msg = document.getElementById('regMsg');
      btn.disabled = true;
      btn.textContent = 'Memproses...';

      const fd = new FormData(e.target);
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: fd.get('name'),
            username: fd.get('username'),
            email: fd.get('email'),
            password: fd.get('password')
          })
        });
        const data = await res.json();
        if (data.ok) {
          showMsg(msg, 'Registrasi berhasil! Mengalihkan...', 'success');
          setTimeout(() => window.location.href = '/dashboard', 600);
        } else {
          showMsg(msg, data.message || 'Gagal daftar', 'error');
          btn.disabled = false;
          btn.textContent = 'Daftar';
        }
      } catch (err) {
        showMsg(msg, 'Server tidak merespons.', 'error');
        btn.disabled = false;
        btn.textContent = 'Daftar';
      }
    });
  </script>
</body>
</html>
